spring.application.name=bluff-card-game
server.port=8080
# Trust X-Forwarded-* headers so links built behind a tunnel or proxy use the public address.
server.forward-headers-strategy=framework

# Static front-end lives in src/main/resources/static
spring.web.resources.cache.cachecontrol.no-cache=true

logging.level.com.bluffgame=INFO
logging.level.com.bluffgame.truth=INFO
