# `./mvnw spring-boot:run -Dspring-boot.run.profiles=dev` serves the front-end straight from the
# source tree, so editing HTML/CSS/JS only needs a browser refresh.
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
logging.level.com.bluffgame=DEBUG
